<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>WaifuAI Chat</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%23d9466f' d='M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.8 4.5c2.2 0 3.6 1.2 4.4 2.6.8-1.4 2.2-2.6 4.4-2.6 3.8 0 5.9 3.9 4.4 7.3C19.5 16.4 12 21 12 21z'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/common.css?v=1">
  <link rel="stylesheet" href="/static/chat.css?v=1">
</head>
<body>
  <div class="app" id="app">
    <aside class="roster">
      <div class="roster-head">
        <div class="brand">Waifu<span>AI</span></div>
        <a class="btn sm ghost" href="/admin">Quản lý</a>
      </div>
      <div class="roster-list" id="roster"></div>
    </aside>

    <main class="thread" id="thread">
      <div class="thread-empty" id="threadEmpty">
        <div class="empty-heart">♡</div>
        <p>Chọn một nhân vật để bắt đầu trò chuyện</p>
      </div>
      <header class="thread-head hidden" id="threadHead">
        <button class="btn icon ghost back" id="backBtn" aria-label="Quay lại">←</button>
        <span id="headAvatar"></span>
        <div class="head-info">
          <div class="head-name" id="headName"></div>
          <div class="head-status" id="headStatus"></div>
        </div>
      </header>
      <div class="messages hidden" id="messages"></div>
      <form class="composer hidden" id="composer" autocomplete="off">
        <button type="button" class="btn icon ghost" id="photoBtn" data-tip="Xin ảnh" aria-label="Xin ảnh">📷</button>
        <textarea id="input" rows="1" placeholder="Nhắn tin..." enterkeyhint="send"></textarea>
        <button type="submit" class="btn primary send" id="sendBtn" aria-label="Gửi">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true"><path d="M3.4 20.4 21 12 3.4 3.6 3.4 10l12.6 2-12.6 2z"/></svg>
        </button>
      </form>
    </main>
  </div>
  <script src="/static/ui.js?v=1"></script>
  <script src="/static/chat.js?v=1"></script>
</body>
</html>
